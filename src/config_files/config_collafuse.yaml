data:
  fill_strategy: median
  test_size: 0.15
  correlation_threshold: 0.95
  variance_threshold: 0.01
  col_nan_threshold: 0.1
  row_nan_threshold: 0.5
  encoder_reference_client_id: CLIENT_0
  shuffle_seed: 38
  drop_columns: []

client_split:
  client_column: client_id
  client_label_column: client_label
  num_clients: 5

collafuse:
  device: auto
  num_timesteps: 100
  tau_ratio: 0.2
  batch_size: 2000
  epochs: 200
  learning_rate: 0.0001
  lr_warmup_steps: 200
  beta_start: 0.0001
  beta_end: 0.02
  time_embed_dim: 128
  checkpoint_every: 25
  w1: 0.1
  w2: 0.1
  num_workers: 0

sampling:
  samples_per_client: 256
  sample_batch_size: 512
  random_seed: 42
  n_inference_timesteps: 100
  target_label: 1

augmentation:
  ratios: [0.01, 0.05, 0.1, 0.2, 0.5]
  smote_k_neighbors: 5
  adasyn_n_neighbors: 5

evaluation:
  classifier_seeds: [0]
  mmd_seeds: [0,1,2]
  pca_components: 10
  tsne_perplexity: 30.0
  tsne_learning_rate: auto
  tsne_random_state: 42
  mmd_batch_size: 128

baselines:
  enabled_sources:
    - real_only_unweighted
    - real_only_weighted
    - random_oversampling
    - smote
    - adasyn
    - collafuse
    - ctgan
    - tabddpm
    - local_only_ddpm
    - centralized_ddpm
  ctgan_epochs: 50
  ctgan_batch_size: 256
  ctgan_generator_dim: [256, 256]
  ctgan_discriminator_dim: [256, 256]

classifiers:
  suite:
    - name: logistic_regression
      params:
        max_iter: 2000
        solver: lbfgs
    - name: random_forest
      params:
        n_estimators: 300
        min_samples_leaf: 2
    - name: hist_gradient_boosting
      params:
        learning_rate: 0.05
        max_depth: 6
        max_iter: 300
